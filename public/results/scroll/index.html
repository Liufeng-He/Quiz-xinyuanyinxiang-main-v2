  <details><summary>关于这份心院印象</summary><div class="xr-methods">这份集体印象由本次调查的82份回答共同组成。82份回答中63份来自心理与认知科学学院，不代表全校意见。多选按选择人数计数；各页分母单独标注。画像名称与三维含义依据原问卷项目：亲近/观望、鲜明/潜行、探索/陪伴。课程归并“普心”等明确别名，并拆分多课程回答。引语为匿名原文或连续节选。生活应用中“没有变化”存在与其他选项同时选择的情况，不将其直接解释为“心理学无用”。未使用缺少定义的派生分数作心理测量。来源：survey_responses_rows (2).csv 与问卷源码。</div></details>

    }
